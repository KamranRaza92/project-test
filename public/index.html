<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8" />  
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>  
<title>Fabric Dyeing Portal</title>  
<link rel="stylesheet" href="styles.css" />  
</head>  
<body>  
<h1>Fabric Dyeing Inventory</h1>  

<div id="auth-section">  
  <h2 id="auth-title">Login</h2>  
  <form id="auth-form">  
    <input type="text" id="auth-username" placeholder="Username" required />  
    <input type="password" id="auth-password" placeholder="Password" required />  
    <button type="submit" id="auth-submit">Login</button>  
  </form>  
  <button onclick="showRegister()">Register</button>  
</div>  

<div id="app-section" style="display:none;">  
  <button onclick="logout()">Logout</button>  
  <h2 id="form-title">Add New Fabric</h2>  
  <form id="fabric-form">  
    <input type="hidden" id="fabric-id" />  
    <label>Name: <input type="text" id="name" required></label><br/>  
    <label>Color: <input type="text" id="color" required></label><br/>  
    <label>Quantity: <input type="number" id="quantity" required></label><br/>  
    <button type="submit">Save</button>  
    <button type="button" onclick="resetForm()">Cancel</button>  
  </form>  

  <h2>Fabric List</h2>  
  <table>  
    <thead>  
      <tr>  
        <th>Name</th><th>Color</th><th>Quantity</th><th>Actions</th>  
      </tr>  
    </thead>  
    <tbody id="fabric-table-body"></tbody>  
  </table>  
</div>  

<script src="script.js"></script>  
</body>  
</html>
